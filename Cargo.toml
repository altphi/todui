[package]
name = "todui"
version = "0.1.0"
description = "tui todo"
authors = ["Stephen Beck <2529298+altphi@users.noreply.github.com>"]
license = "MIT"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.0"
color-eyre = "0.6.3"
dirs = "6"
shellexpand = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
toml = "1.1"
serde = { version = "1", features = ["derive"] }
automerge = "0.7"
autosurgeon = "0.10"
uuid = { version = "1", features = ["v4"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["rt", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
futures-util = "0.3.32"
reqwest = { version = "0.13.2", features = ["blocking", "json", "native-tls"] }

[dev-dependencies]
tempfile = "3.26.0"
